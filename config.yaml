paths:
  pdf_dir: "See_DR_bot"  # Relative path - PDFs not needed on Render (vector store is pre-built)
  processed_dir: "data/processed"
  vector_store_dir: "vector_store"  # Can be overridden by VECTOR_STORE_DIR env var

models:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  llm_model: "gemini-2.5-flash"

retrieval:
  top_k: 8
  rerank_top_n: 20
  min_similarity_score: 0.3

chunking:
  target_tokens: 600
  max_tokens: 800
  min_tokens: 200
  overlap_percent: 20  # 15-25% recommended
  similarity_threshold: 0.65  # 0.6-0.7 for semantic breaks

environment:
  offline: true
  ollama_base_url: "http://localhost:11434"
