services:
  - type: web
    name: see-dr-ragbot-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn see_dr_ragbot.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VECTOR_STORE_DIR
        value: vector_store
      - key: CORS_ORIGINS
        value: "*"

